[graph]
all-features = true

[licenses]
# What the tree actually pulls in, not a wishlist. cargo-deny warns on an
# allowance nothing matches, so the list stays honest by being checked rather
# than by being remembered. A dependency under a licence not named here fails
# gate 4 — that is the prompt to read the licence and add it deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # The whole icu_* chain relicensed from Unicode-DFS-2016 to this, and
    # jsonschema reaches that chain through idna.
    "Unicode-3.0",
    # MIT without the attribution clause — strictly more permissive than MIT,
    # which is already allowed above.
    "MIT-0",
]
confidence-threshold = 0.93

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A `{ path = "..." }` dependency with no version requirement is a wildcard, so
# the four crates here depending on each other trip the rule above. This exempts
# path dependencies specifically; a wildcard on anything from a registry is
# still denied, which is the case the rule is actually for.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
