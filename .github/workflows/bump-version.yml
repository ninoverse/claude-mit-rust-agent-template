name: Bump Version and Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-and-tag:
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      # 1. Generate an installation token using your GitHub App credentials
      - name: Generate Token from GitHub App
        id: get_workflow_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # 2. Checkout the repository using the App Token instead of GITHUB_TOKEN
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.get_workflow_token.outputs.token }}

      - name: Check Cargo.toml exists
        id: pkg
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "Cargo.toml not found; skipping version bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump type from Commit Message
        id: bump
        if: steps.pkg.outputs.skip == 'false'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          msg=$(echo "$COMMIT_MSG" | head -n 1)
          bump="skip"
          
          echo "Analyzing commit subject: $msg"
          
          # 1. Major (Breaking Change: explicit ! or BREAKING CHANGE anywhere in the message)
          if [[ "$msg" =~ ^[a-z]+(\([a-z0-9_-]+\))?!: ]] || [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]]; then
            bump="major"
          # 2. Minor (New features)
          elif [[ "$msg" =~ ^feat(\([a-z0-9_-]+\))?: ]]; then
            bump="minor"
          # 3. Patch (Fixes, Perf, Refactor, and other changes that don't alter user behavior but merit a version bump)
          elif [[ "$msg" =~ ^(fix|perf|refactor|revert|style|chore|docs)(\([a-z0-9_-]+\))?: ]]; then
            bump="patch"
          fi
          
          echo "Computed bump=$bump for commit message."
          echo "type=$bump" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        if: steps.pkg.outputs.skip == 'false' && steps.bump.outputs.type != 'skip'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        if: steps.pkg.outputs.skip == 'false' && steps.bump.outputs.type != 'skip'
        uses: cargo-bins/cargo-binstall@main

      - name: Bump version
        id: ver
        if: steps.pkg.outputs.skip == 'false' && steps.bump.outputs.type != 'skip'
        run: |
          cargo binstall --no-confirm cargo-edit
          # Bump the shared [workspace.package].version; every crate inherits it via
          # `version.workspace = true`, so all crates move in lockstep.
          cargo set-version --bump ${{ steps.bump.outputs.type }} --workspace
          new_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="agent-cli") | .version')
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit, Tag, and Push
        if: steps.pkg.outputs.skip == 'false' && steps.bump.outputs.type != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${{ steps.ver.outputs.version }}"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin main --tags