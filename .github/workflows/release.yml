name: Deploy to Cloud Run on Tag Push

# The deploy itself lives in ninoverse/.github; this file sets the trigger and
# names the service. Cloud Build builds the repo-root Dockerfile via
# `--source .`, pushes the image, and deploys it. Cloud Run injects PORT, which
# agent-server reads.
#
# The tag this watches for is the one bump-version.yml pushes. That only works
# because that workflow pushes with a GitHub App token: a tag pushed with
# GITHUB_TOKEN deliberately does not trigger other workflows, so this would
# never fire.
#
# Before this can deploy, set as repository variables and secrets:
#   vars.GCP_PROJECT, vars.GCP_REGION, secrets.GCP_SERVICE_ACCOUNT

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  deploy:
    uses: ninoverse/.github/.github/workflows/release-cloudrun.yml@v1
    with:
      # Matches the binary the Dockerfile builds with `-p agent-server`.
      service: agent-server
      project: ${{ vars.GCP_PROJECT }}
      region: ${{ vars.GCP_REGION }}
    secrets:
      gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
