[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ninoverse/claude_mit_rust_template"
rust-version = "1.84"

[workspace.dependencies]
dotenvy = "0.15"
jsonschema = "0.26"
chrono = "0.4"
async-trait = "0.1"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }





[profile.release]
lto = "thin"
codegen-units = 1

