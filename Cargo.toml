[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/ninoverse/claude-mit-rust-agent-template"
rust-version = "1.86"
# These are application crates — a CLI, an HTTP server, and the two libraries
# they share — not something to put on crates.io. It is also what lets them
# depend on each other by path: cargo-deny reads a path dependency with no
# version requirement as a wildcard, and only exempts one on a private crate.
# Set `publish = true` on a specific crate if you do mean to publish that one.
publish = false

[workspace.dependencies]
dotenvy = "0.15.7"
# Default features without `resolve-http` and its TLS backend: tool schemas
# are validated as the agent holds them, so nothing is fetched over HTTP, and
# the feature would bring in reqwest and rustls for nothing.
jsonschema = { version = "0.58.6", default-features = false, features = ["resolve-file", "idna"] }
chrono = "0.4.45"
async-trait = "0.1.92"
tokio = { version = "1.53.2", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }

# Enforced in every build and in rust-analyzer, not just when someone remembers
# `-D warnings`. Crates opt in with `[lints] workspace = true` in their manifest.
[workspace.lints.rust]
# Opt in per crate with a justified `#![allow(unsafe_code)]`; see .agents/rust-code-review.md.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Warn, not deny: .agents/rust-code-review.md exempts test code, which allows these
# back in via the `#![allow(...)]` in the test-module template.
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
panic_in_result_fn = "warn"


[profile.release]
lto = "thin"
codegen-units = 1

