# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# The backend builds from the repo-root Dockerfile and serves the agent-server
# binary. App Hosting injects PORT at runtime; the server reads it.

runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: RUST_LOG
    value: agent_server=info,agent_core=info,warn
    availability:
      - RUNTIME
